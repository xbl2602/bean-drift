<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="title description">
<title id="title">Bean Drift — explore, compare, discover</title>
<desc id="description">Decorative pixel-art animation in three scenes: astronaut, lunar lander, then satellite and rover. Not a live mission display. Reduced motion shows the astronaut scene.</desc>
<defs>
 <linearGradient id="spaceBg" x2="1" y2="1"><stop stop-color="#0d1a23"/><stop offset="1" stop-color="#070d14"/></linearGradient>
 <linearGradient id="neonRing"><stop stop-color="#b9df75"/><stop offset="1" stop-color="#55b9dc"/></linearGradient>
 <linearGradient id="radarSweep"><stop stop-color="#b9df75" stop-opacity=".12"/><stop offset="1" stop-color="#b9df75" stop-opacity="0"/></linearGradient>
 <clipPath id="frame"><rect x="2" y="2" width="756" height="246" rx="20"/></clipPath>
 <style>
 text{font-family:ui-monospace,Consolas,monospace}
 .chapter{font-size:10px;letter-spacing:2px;fill:#b9df75}
 .headline{font-size:29px;font-weight:700;fill:#edf4f2;letter-spacing:-1px}
 .body{font-size:12px;fill:#a9bdc9}
 .scene{opacity:0;animation:changeScene 24s ease-in-out infinite;transform-origin:50% 50%}
 .scene-1{opacity:1}.scene-2{animation-delay:-16s}.scene-3{animation-delay:-8s}
 .astro-float{animation:float 4s ease-in-out infinite}
 .ring-cw{transform-origin:396px 105px;animation:spin 22s linear infinite}
 .ring-ccw{transform-origin:396px 105px;animation:spin 30s linear infinite reverse}
 .lander-descend{animation:float 5s ease-in-out infinite}
 .sat-orbit{animation:float 5s ease-in-out infinite}
 .rover-drift{animation:drift 5s ease-in-out infinite}
 .meteor{opacity:0;animation:meteorPass 9s linear infinite;pointer-events:none}
 .meteor-two{animation-delay:-3s}.meteor-three{animation-delay:-6s}
 @keyframes meteorPass{0%{opacity:0;transform:translate(0,0)}2%{opacity:.7}12%{opacity:0;transform:translate(-105px,27px)}100%{opacity:0;transform:translate(-105px,27px)}}
 @media(prefers-reduced-motion:reduce){.meteor{animation:none!important;opacity:0!important}}
 .indicator{fill:#42545f}.indicator-1{fill:#b9df75;animation:indicator 24s infinite}
 .indicator-2{animation:indicator 24s infinite;animation-delay:-16s}
 .indicator-3{animation:indicator 24s infinite;animation-delay:-8s}
 @keyframes changeScene{0%,26%{opacity:1;transform:translate(0,0)}29%{opacity:0;transform:translate(90px,-24px)}30%,96%{opacity:0;transform:translate(-40px,14px)}100%{opacity:1;transform:translate(0,0)}}
 @keyframes indicator{0%,30%{fill:#b9df75}33%,96%{fill:#42545f}100%{fill:#b9df75}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @media(prefers-reduced-motion:reduce){.scene,.indicator,.astro-float,.ring-cw,.ring-ccw,.lander-descend,.sat-orbit,.rover-drift{animation:none!important}.scene{opacity:0}.scene-1{opacity:1}.indicator-1{fill:#b9df75}.indicator-2,.indicator-3{fill:#42545f}}
 </style>
</defs>
<g clip-path="url(#frame)">
<rect x="2" y="2" width="756" height="246" rx="20" fill="url(#spaceBg)"/>
<g fill="#6e8898" opacity=".45"><rect x="400" y="32" width="2" height="2"/><rect x="697" y="49" width="3" height="3"/><rect x="453" y="184" width="2" height="2"/><rect x="714" y="178" width="2" height="2"/></g>
<path d="M32 205H728" stroke="#263944"/>
<!-- Decorative meteor trails, staggered so only one crosses the quiet upper sky. -->
<g aria-hidden="true" fill="none" stroke-linecap="round">
 <g transform="translate(340,22)"><g class="meteor"><path d="M0 0L32 -8" stroke="#79cde7" stroke-width="1.5"/><path d="M0 0L12 -3" stroke="#e2f6f4" stroke-width="2"/></g></g>
 <g transform="translate(475,16)"><g class="meteor meteor-two"><path d="M0 0L25 -6" stroke="#a8cf7d" stroke-width="1.5"/><path d="M0 0L8 -2" stroke="#ecf5d7" stroke-width="2"/></g></g>
 <g transform="translate(720,24)"><g class="meteor meteor-three"><path d="M0 0L30 -8" stroke="#79cde7" stroke-width="1.5"/><path d="M0 0L10 -3" stroke="#e2f6f4" stroke-width="2"/></g></g>
</g>
<g class="scene scene-1" aria-hidden="true">
 <text class="chapter" x="46" y="78">01 / BEAN DRIFT</text>
 <text class="headline" x="46" y="111">Meet your lunar guide.</text>
 <text class="body" x="46" y="139">One Moon. A different perspective.</text>
 <text class="body" x="46" y="158">Explore with Commander Bean.</text>
 <g transform="translate(164,4)">  <!-- ================= CENTER SCENE: RADAR PORTAL + JETPACK BEAN ASTRONAUT ================= -->
  <circle cx="396" cy="105" r="86" fill="#0b151d" stroke="#1e3a46" stroke-width="2" shape-rendering="geometricPrecision" />
  <circle cx="396" cy="105" r="62" fill="none" stroke="#1d313a" stroke-dasharray="4 6" shape-rendering="geometricPrecision" />
  <line x1="310" y1="105" x2="482" y2="105" stroke="#15262e" />
  <line x1="396" y1="19" x2="396" y2="191" stroke="#15262e" />

  <g class="ring-cw">
    <path d="M396 105 L396 23 A82 82 0 0 1 466 63 Z" fill="url(#radarSweep)" />
    <circle cx="396" cy="105" r="82" fill="none" stroke="url(#neonRing)" stroke-width="3" stroke-dasharray="42 22 14 22" />
    <circle cx="396" cy="23" r="4.5" fill="#a3e635" />
  </g>
  <g class="ring-ccw">
    <circle cx="396" cy="105" r="74" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 16" opacity="0.85" />
    <circle cx="396" cy="179" r="3.5" fill="#38bdf8" />
  </g>

  <g transform="translate(348, 44)">
    <g class="astro-float">
      <rect x="10" y="28" width="76" height="44" fill="#64748b" />
      <rect x="14" y="24" width="68" height="6" fill="#94a3b8" />
      <rect x="6" y="34" width="8" height="32" fill="#475569" />
      <rect x="82" y="34" width="8" height="32" fill="#475569" />
      <rect x="18" y="8" width="4" height="16" fill="#cbd5e1" />
      <rect x="16" y="4" width="8" height="6" fill="#a3e635" class="star-blink" />
      <g class="flame">
        <rect x="12" y="72" width="10" height="12" fill="#facc15" />
        <rect x="14" y="84" width="6" height="8" fill="#ef4444" />
        <rect x="74" y="72" width="10" height="12" fill="#facc15" />
        <rect x="76" y="84" width="6" height="8" fill="#ef4444" />
      </g>
      <rect x="26" y="8" width="44" height="6" fill="#f8fafc" />
      <rect x="20" y="14" width="56" height="42" fill="#f8fafc" />
      <rect x="16" y="20" width="64" height="30" fill="#e2e8f0" />
      <rect x="24" y="56" width="48" height="6" fill="#cbd5e1" />
      <rect x="24" y="18" width="48" height="34" fill="#09131c" />
      <rect x="28" y="22" width="40" height="28" fill="#b5e550" />
      <rect x="32" y="18" width="32" height="4" fill="#d2f47a" />
      <rect x="26" y="27" width="44" height="4" fill="#05080d" />
      <rect x="28" y="31" width="16" height="7" fill="#05080d" />
      <rect x="52" y="31" width="16" height="7" fill="#05080d" />
      <rect x="30" y="29" width="3" height="6" fill="#ffffff" />
      <rect x="54" y="29" width="3" height="6" fill="#ffffff" />
      <rect x="44" y="41" width="8" height="4" fill="#1e293b" />
      <rect x="46" y="43" width="4" height="3" fill="#fb7185" />
      <rect x="24" y="62" width="48" height="30" fill="#f8fafc" />
      <rect x="16" y="64" width="8" height="20" fill="#e2e8f0" />
      <rect x="72" y="64" width="8" height="20" fill="#e2e8f0" />
      <rect x="14" y="82" width="10" height="8" fill="#a3e635" />
      <rect x="72" y="82" width="10" height="8" fill="#a3e635" />
      <rect x="34" y="68" width="28" height="18" fill="#1e293b" />
      <rect x="38" y="72" width="6" height="6" fill="#a3e635" />
      <rect x="46" y="72" width="6" height="6" fill="#38bdf8" />
      <rect x="54" y="72" width="4" height="10" fill="#facc15" />
      <rect x="38" y="80" width="14" height="3" fill="#94a3b8" />
      <rect x="28" y="92" width="16" height="14" fill="#e2e8f0" />
      <rect x="52" y="92" width="16" height="14" fill="#e2e8f0" />
      <rect x="26" y="104" width="20" height="8" fill="#38bdf8" />
      <rect x="50" y="104" width="20" height="8" fill="#38bdf8" />
    </g>
  </g>

  <rect x="320" y="182" width="152" height="18" rx="9" fill="#0f1b24" stroke="#a3e635" stroke-width="1.2" shape-rendering="geometricPrecision" />
  <text x="396" y="194" fill="#a3e635" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">COMMANDER: BEAN-86 EVA</text>

</g>
 </g><g class="scene scene-2" aria-hidden="true">
 <text class="chapter" x="46" y="78">02 / BEAN DRIFT</text>
 <text class="headline" x="46" y="111">Choose where to land.</text>
 <text class="body" x="46" y="139">Compare sunlight, terrain and Earth visibility.</text>
 <text class="body" x="46" y="158">Turn a coordinate into a clearer decision.</text>
 <g transform="translate(225,-7) scale(1.22)">  <!-- Glowing Target Landing Pad (LZ-01) on the Lunar Surface -->
  <g transform="translate(226, 158)">
    <rect x="6" y="2" width="56" height="4" fill="#a3e635" opacity="0.85" />
    <rect x="0" y="4" width="8" height="4" fill="#38bdf8" class="star-blink" />
    <rect x="60" y="4" width="8" height="4" fill="#38bdf8" class="star-blink" />
    <!-- Surface Regolith Dust Plume Kicked Up by Lander Thruster -->
    <g transform="translate(34, 0)">
      <g class="plume-dust" fill="#cbd5e1">
        <rect x="-32" y="-6" width="12" height="6" opacity="0.7" />
        <rect x="-20" y="-4" width="10" height="4" opacity="0.5" />
        <rect x="10" y="-4" width="10" height="4" opacity="0.5" />
        <rect x="20" y="-6" width="12" height="6" opacity="0.7" />
      </g>
    </g>
    <text x="34" y="16" fill="#a3e635" font-family="monospace" font-weight="bold" font-size="8" text-anchor="middle">TOUCHDOWN</text>
  </g>

  <!-- Descending Lunar Lander Machine (Apollo / Artemis Style Spacecraft) -->
  <g transform="translate(226, 66)">
    <!-- Laser Altimeter Guide Beams Down to LZ-01 -->
    <line x1="20" y1="54" x2="10" y2="92" stroke="#a3e635" stroke-width="1" stroke-dasharray="2 3" opacity="0.7" />
    <line x1="48" y1="54" x2="58" y2="92" stroke="#a3e635" stroke-width="1" stroke-dasharray="2 3" opacity="0.7" />

    <g class="lander-descend">
      <!-- Top High-Gain Dish & Docking Mast -->
      <rect x="32" y="0" width="4" height="8" fill="#cbd5e1" />
      <rect x="26" y="2" width="16" height="3" fill="#38bdf8" />
      <rect x="32" y="-3" width="4" height="3" fill="#a3e635" class="star-blink" />

      <!-- Upper Ascent Stage Cabin (White/Silver Pressure Module + Windows) -->
      <rect x="18" y="8" width="32" height="20" fill="#f8fafc" />
      <rect x="14" y="12" width="40" height="12" fill="#e2e8f0" />
      <!-- Triangular Lander Observation Windows + Mini Bean Pilot -->
      <rect x="22" y="12" width="10" height="8" fill="#0f172a" />
      <rect x="36" y="12" width="10" height="8" fill="#0f172a" />
      <rect x="24" y="14" width="6" height="5" fill="#b5e550" />
      <rect x="38" y="14" width="6" height="5" fill="#38bdf8" />
      <!-- Side RCS Attitude Control Thrusters + Puff Jets -->
      <rect x="8" y="15" width="6" height="4" fill="#64748b" />
      <rect x="54" y="15" width="6" height="4" fill="#64748b" />
      <g class="flame" fill="#e0f2fe">
        <rect x="2" y="16" width="5" height="2" />
        <rect x="61" y="16" width="5" height="2" />
      </g>

      <!-- Lower Descent Stage (Gold Kapton Thermal Foil & Propellant Bay) -->
      <rect x="12" y="28" width="44" height="18" fill="#eab308" />
      <rect x="16" y="30" width="36" height="14" fill="#facc15" />
      <rect x="26" y="30" width="16" height="14" fill="#ca8a04" />
      <!-- NASA-style Telemetry Panel on Descent Stage -->
      <rect x="29" y="33" width="10" height="8" fill="#1e293b" />
      <rect x="31" y="35" width="6" height="4" fill="#a3e635" />

      <!-- Deployed Lunar Landing Struts & Wide Footpads -->
      <!-- Left Leg -->
      <rect x="8" y="42" width="6" height="6" fill="#94a3b8" />
      <rect x="4" y="48" width="6" height="8" fill="#94a3b8" />
      <rect x="0" y="56" width="12" height="4" fill="#facc15" />
      <!-- Right Leg -->
      <rect x="54" y="42" width="6" height="6" fill="#94a3b8" />
      <rect x="58" y="48" width="6" height="8" fill="#94a3b8" />
      <rect x="56" y="56" width="12" height="4" fill="#facc15" />
      <!-- Center Leg -->
      <rect x="32" y="46" width="4" height="12" fill="#64748b" />

      <!-- Main Descent Engine Bell & Firing Rocket Plume -->
      <rect x="26" y="46" width="16" height="6" fill="#334155" />
      <g class="flame">
        <rect x="28" y="52" width="12" height="10" fill="#38bdf8" />
        <rect x="30" y="54" width="8" height="14" fill="#fef08a" />
        <rect x="32" y="68" width="4" height="10" fill="#f97316" />
      </g>
    </g>

    <!-- Lander Descent HUD Readout -->
    <text x="34" y="-8" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">APPROACH</text>
  </g>

</g>
 </g><g class="scene scene-3" aria-hidden="true">
 <text class="chapter" x="46" y="78">03 / BEAN DRIFT</text>
 <text class="headline" x="46" y="111">See what surrounds you.</text>
 <text class="body" x="46" y="139">Ask a question. Discover nearby landmarks.</text>
 <text class="body" x="46" y="158">Explore in 3D, 2D and from the surface.</text>
 <g transform="translate(-35,23)">  <!-- ================= RIGHT SCENE: LRO SATELLITE + DRIFTING LUNAR ROVER ================= -->
  <g transform="translate(524, 24)">
    <g class="sat-orbit">
      <rect x="0" y="8" width="22" height="10" fill="#0284c7" />
      <rect x="4" y="10" width="14" height="6" fill="#38bdf8" />
      <rect x="22" y="11" width="6" height="4" fill="#94a3b8" />
      <rect x="28" y="4" width="18" height="18" fill="#facc15" />
      <rect x="46" y="11" width="6" height="4" fill="#94a3b8" />
      <rect x="52" y="8" width="22" height="10" fill="#0284c7" />
      <rect x="56" y="10" width="14" height="6" fill="#38bdf8" />
      <line x1="37" y1="22" x2="48" y2="82" stroke="#a3e635" stroke-width="1" stroke-dasharray="3 3" />
    </g>
  </g>

  <g transform="translate(508, 108)">
    <g class="rover-drift">
      <rect x="28" y="6" width="52" height="22" fill="#f8fafc" />
      <rect x="34" y="10" width="38" height="16" fill="#0f172a" />
      <rect x="42" y="12" width="18" height="14" fill="#b5e550" />
      <rect x="40" y="15" width="20" height="4" fill="#05080d" />
      <rect x="8" y="26" width="96" height="14" fill="#f8fafc" />
      <rect x="8" y="34" width="96" height="8" fill="#0f172a" />
      <rect x="96" y="14" width="6" height="12" fill="#0f172a" />
      <rect x="92" y="10" width="16" height="5" fill="#a3e635" />
      <rect x="4" y="28" width="8" height="8" fill="#facc15" />
      <rect x="-8" y="29" width="12" height="6" fill="#fef08a" opacity="0.65" />
      <rect x="20" y="38" width="20" height="18" fill="#1e293b" />
      <rect x="24" y="42" width="12" height="10" fill="#a3e635" />
      <rect x="72" y="38" width="20" height="18" fill="#1e293b" />
      <rect x="76" y="42" width="12" height="10" fill="#a3e635" />
      <g class="flame" fill="#cbd5e1">
        <rect x="104" y="36" width="14" height="12" />
        <rect x="114" y="28" width="18" height="16" fill="#e2e8f0" />
        <rect x="128" y="20" width="14" height="14" fill="#94a3b8" />
      </g>
    </g>
  </g>
</g>
 </g><text x="46" y="229" fill="#a0b4c1" font-family="monospace" font-size="9">LUNAR LANDING SITE NAVIGATOR</text>
<g transform="translate(650,224)"><rect class="indicator indicator-1" width="18" height="3" rx="1.5"/><rect class="indicator indicator-2" x="26" width="18" height="3" rx="1.5"/><rect class="indicator indicator-3" x="52" width="18" height="3" rx="1.5"/></g>
</g><rect x="2" y="2" width="756" height="246" rx="20" fill="none" stroke="#304650" stroke-width="1.5"/>
</svg>
